version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alpine-postgres
    environment:
      POSTGRES_DB: alfin_lakes
      POSTGRES_USER: amit_chandna
      POSTGRES_PASSWORD: oX6PozwzvIVfSG
    ports:
      - "5432:5432"
    volumes:
      - /Users/amitchandna/Documents/alpine_finance/af_db/:/var/lib/postgresql/data

    healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U amit_chandna -d alfin_lakes" ]
          interval: 10s
          timeout: 5s
          retries: 5
    networks:
      - alpine-network
    # This allows the Postgres container to easily resolve your Mac's IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

